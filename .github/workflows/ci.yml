# CI for thevoltcloud/docs (Fumadocs / Next.js).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run types:check
      - name: Build
        run: npm run build

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate API reference spec
        run: npx --yes @redocly/cli@latest lint public/openapi.yaml

  secret-scan:
    uses: thevoltcloud/.github/.github/workflows/shared-secret-scan.yml@main
    secrets: inherit
